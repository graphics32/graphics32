<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="matrixFilter">
      <feColorMatrix type="hueRotate" values="180"/>
    </filter>
  </defs>

  <!-- Left: Unfiltered shape (red) -->
  <rect x="30" y="50" width="100" height="100" fill="#e74c3c"/>

  <!-- Right: Filtered shape (hue rotated color) -->
  <rect x="230" y="50" width="100" height="100" fill="#e74c3c" filter="url(#matrixFilter)"/>
</svg>
