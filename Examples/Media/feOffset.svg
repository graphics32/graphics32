<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="offsetFilter" x="-20%" y="-20%" width="150%" height="150%">
      <feOffset in="SourceGraphic" dx="20" dy="20"/>
    </filter>
  </defs>

  <!-- Left: Unfiltered shape -->
  <rect x="30" y="50" width="100" height="100" fill="#e67e22"/>

  <!-- Right: Filtered shape (shifted by dx=20, dy=20) -->
  <rect x="230" y="50" width="100" height="100" fill="#e67e22" filter="url(#offsetFilter)"/>
</svg>
