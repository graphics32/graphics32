<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Left: Unfiltered shape -->
  <rect x="30" y="50" width="100" height="100" fill="#3498db"/>

  <!-- Right: Filtered shape (distinct blurred edges) -->
  <rect x="230" y="50" width="100" height="100" fill="#3498db" filter="url(#blurFilter)"/>
</svg>
